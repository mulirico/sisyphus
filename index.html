<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Sisyphus</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --bg: #dfdfdf;
        --hint: #6b6b70;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .device {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .screen {
        width: min(720px, calc(100vw - 32px), calc((100dvh - 110px) * 1.5));
        min-width: 240px;
        aspect-ratio: 3 / 2;
        background: #1a1a1a;
        cursor: pointer;
      }

      .device[data-phase="falling"] .screen,
      .device[data-phase="settling"] .screen {
        cursor: default;
      }

      .screen canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      .hint {
        margin: 0;
        height: 1em;
        font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hint);
        visibility: hidden;
      }

      .device.is-idle .hint {
        visibility: visible;
      }

      .about {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid var(--hint);
        color: var(--hint);
        font: 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        text-decoration: none;
      }

      .about:hover,
      .about:focus-visible {
        background: var(--hint);
        color: var(--bg);
        outline: none;
      }
    </style>
  </head>
  <body>
    <main class="device is-idle" data-phase="climbing">
      <div class="screen">
        <canvas id="c" aria-label="Sisyphus pushes the boulder up the mountain"></canvas>
      </div>
      <p class="hint">click or hit up</p>
    </main>
    <a class="about" href="https://en.wikipedia.org/wiki/Sisyphus" target="_blank" rel="noopener noreferrer" aria-label="About the myth of Sisyphus">?</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
